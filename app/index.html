<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HearthLedger — Household Budget Studio</title>
<meta name="description" content="HearthLedger is the Alvarez family's household budget studio: income, spending, budgets, bills, savings goals and plain-English insights for November 2026 — all in one place, all offline.">
<script>
// Before first paint: restore the saved language and theme (or the
// system's colour scheme) so the page never flashes the wrong ones.
(function () {
  try {
    var lang = localStorage.getItem("hearthledger-lang-v1");
    if (lang === "id" || lang === "en") document.documentElement.lang = lang;
    var theme = localStorage.getItem("hearthledger-theme-v1");
    if (theme !== "dark" && theme !== "light") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = theme;
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="HearthLedger home">
    <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="4" y="4" width="40" height="40" rx="10" fill="#14523f"/>
      <path d="M24 12c3 5 8 7 8 13a8 8 0 1 1-16 0c0-3 2-5 3.5-7 .8 2 2 3 4.5 3-.5-3 .5-7 0-9z" fill="#f4c95d"/>
      <path d="M14 34h20" stroke="#faf6ee" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M17 39h14" stroke="#faf6ee" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span class="brand-text"><strong>HearthLedger</strong><small id="brand-tagline">Household Budget Studio</small></span>
  </a>
  <nav class="mainnav" aria-label="Sections">
    <a href="#/" data-route="dashboard">Dashboard</a>
    <a href="#/transactions" data-route="transactions">Transactions</a>
    <a href="#/budgets" data-route="budgets">Budgets</a>
    <a href="#/goals" data-route="goals">Goals</a>
    <a href="#/bills" data-route="bills">Bills</a>
    <a href="#/insights" data-route="insights">Insights</a>
  </nav>
  <div class="prefs">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="id">ID</button>
    </div>
    <button type="button" id="theme-toggle" class="theme-btn" aria-label="Switch to dark theme">☾</button>
  </div>
  <div class="household-chip" id="household-chip" title="The household this budget tracks">
    <span class="chip-dot" aria-hidden="true"></span>
    <span><strong>The Alvarez Family</strong><small id="chip-sub">November 2026 · 2 adults, 2 kids</small></span>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer class="sitefoot">
  <p id="foot-about"></p>
  <p class="foot-note" id="foot-demo"></p>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
